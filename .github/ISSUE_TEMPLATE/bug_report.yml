name: Report a problem
description: Something doesn't work as expected.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Brisa version
      description: Configuración → Actualizaciones.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: "macOS 26.1, MacBook Air M2"
  - type: dropdown
    id: area
    attributes:
      label: Where does it happen?
      options:
        - Overview
        - Smart cleanup
        - Storage
        - Uninstaller
        - Development
        - Ports
        - History
        - Settings
        - Updates
        - Other
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened.
    validations:
      required: true
